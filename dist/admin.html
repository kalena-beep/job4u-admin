<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs4U Admin — Poster Management</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { heading: ['Poppins'], body: ['Open Sans'] } } }
    }
  </script>
  <style>
    body { font-family: 'Open Sans', sans-serif; }
    h1,h2,h3,h4 { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
      <h1 class="font-heading font-bold text-2xl text-gray-900 mb-2 text-center">Jobs4U Admin</h1>
      <p class="text-gray-500 text-sm text-center mb-8">Sign in to manage your posters</p>
      <form id="login-form" class="space-y-4" onsubmit="return false">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
          <input id="email" type="email" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="admin@jobs4u.sg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
          <input id="password" type="password" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="Your password">
        </div>
        <div id="login-error" class="text-red-600 text-sm hidden"></div>
        <button type="button" id="login-btn" class="w-full bg-[#DD183B] hover:bg-[#CC1939] text-white font-semibold py-2.5 rounded-lg transition-colors cursor-pointer">
          Sign In
        </button>
      </form>
      <p class="text-xs text-gray-400 text-center mt-6">Create a user in Supabase Dashboard &gt; Authentication &gt; Users</p>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-dashboard" class="hidden">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
        <h1 class="font-heading font-bold text-xl text-gray-900">Jobs4U <span class="text-[#DD183B]">Admin</span></h1>
        <div class="flex items-center gap-4">
          <span id="user-email" class="text-sm text-gray-500 hidden sm:block"></span>
          <button id="logout-btn" class="text-sm text-gray-500 hover:text-red-600 transition-colors cursor-pointer">Sign Out</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <!-- Section Tabs -->
      <div id="section-tabs" class="flex flex-wrap gap-2 mb-8">
        <!-- Tabs loaded dynamically -->
        <button id="add-section-btn" class="px-4 py-2 rounded-lg font-medium text-sm cursor-pointer transition-colors border-2 border-dashed border-gray-300 text-gray-400 hover:border-[#DD183B] hover:text-[#DD183B] inline-flex items-center gap-1" title="Add new section">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          New Section
        </button>
      </div>

      <!-- Add New Poster -->
      <div class="bg-white rounded-xl border border-gray-200 p-6 mb-8">
        <h3 class="font-heading font-semibold text-lg text-gray-900 mb-4">Add New Poster</h3>
        <form id="add-form" class="grid sm:grid-cols-2 gap-4" onsubmit="return false">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
            <input id="new-title" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="Job title or poster name">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tags (comma separated)</label>
            <input id="new-tags" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="Python, Docker, SQL">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="new-desc" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="Brief job description"></textarea>
          </div>
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Recruitment Info</label>
            <textarea id="new-info" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="Requirements, qualifications, salary, etc. (each line shown separately)"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Message</label>
            <input id="new-wa" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none" placeholder="Hi, I am interested in...">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Image *</label>
            <input id="new-image" type="file" accept="image/jpeg,image/png,image/webp" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm file:mr-3 file:rounded-md file:border-0 file:bg-red-50 file:text-red-700 file:font-medium file:px-3 file:py-1 file:cursor-pointer cursor-pointer">
          </div>
          <div class="sm:col-span-2 flex justify-end">
            <button type="submit" class="bg-[#DD183B] hover:bg-[#CC1939] text-white font-semibold px-6 py-2.5 rounded-lg transition-colors cursor-pointer inline-flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              Add Poster
            </button>
          </div>
        </form>
      </div>

      <!-- Poster Grid -->
      <div id="poster-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Cards populated by JS -->
      </div>

      <div id="loading" class="text-center py-12 text-gray-400">Loading posters...</div>
      <div id="empty" class="text-center py-12 text-gray-400 hidden">No posters in this section yet. Add one above.</div>
    </main>
  </div>

  <style>
    .tab-btn { background: #f3f4f6; color: #6b7280; }
    .tab-btn.active { background: #DD183B; color: white; }
    .tab-btn:hover:not(.active) { background: #e5e7eb; }
    .poster-card { transition: box-shadow 0.2s ease; }
    .poster-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  </style>

  <script>
    // ======= SUPABASE INIT =======
    const SUPABASE_URL = 'https://xxwtocupkpuzcjcwhyzl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4d3RvY3Vwa3B1emNqY3doeXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNjMzMTUsImV4cCI6MjA5NDczOTMxNX0.EhHNFoOCM6_N2knP4G0_6ofBH-4Dw23SsIy9Q7M8svw';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: false,
        flowType: 'implicit',
        storageKey: 'jobs4u-admin-auth'
      }
    });

    let currentSection = 'merlion';
    let currentUser = null;
    let dashboardVisible = false;

    // ======= AUTH =======
    const loginScreen = document.getElementById('login-screen');
    const dashboard = document.getElementById('admin-dashboard');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    async function showDashboard() {
      if (dashboardVisible) return; // prevent double-calls
      dashboardVisible = true;
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      document.getElementById('user-email').textContent = currentUser.email;
      await loadSections();
      loadPosters();
    }

    function showLogin() {
      dashboardVisible = false;
      currentUser = null;
      dashboard.classList.add('hidden');
      loginScreen.classList.remove('hidden');
    }

    // Check session on load
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        currentUser = session.user;
        showDashboard();
      }
    })();

    async function handleLogin() {
      loginError.classList.add('hidden');
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        loginError.textContent = 'Please enter email and password';
        loginError.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          loginError.textContent = error.message;
          loginError.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }
        currentUser = data.user;
        showDashboard();
      } catch (err) {
        loginError.textContent = 'Connection error. Please try again.';
        loginError.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.getElementById('login-btn').addEventListener('click', handleLogin);
    // Also handle Enter key in password field
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      showLogin();
    });

    // ======= SECTIONS =======
    let sections = [];

    async function loadSections() {
      const { data, error } = await sb
        .from('sections')
        .select('*')
        .order('sort_order', { ascending: true });

      if (error || !data) {
        // Fallback to hardcoded sections
        sections = [
          { id: '1', name: 'Merlion Technologies', slug: 'merlion', sort_order: 1 },
          { id: '2', name: 'Kee Hing Hung', slug: 'khh', sort_order: 2 }
        ];
      } else {
        sections = data;
      }
      renderTabs();
    }

    function renderTabs() {
      const container = document.getElementById('section-tabs');
      const addBtn = document.getElementById('add-section-btn');

      // Remove old tab buttons (keep the add button)
      container.querySelectorAll('.tab-btn').forEach(b => b.remove());

      sections.forEach((sec, i) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn px-5 py-2 rounded-lg font-medium text-sm cursor-pointer transition-colors ${sec.slug === currentSection ? 'active' : ''}`;
        btn.dataset.section = sec.slug;
        btn.dataset.id = sec.id;
        btn.textContent = sec.name;
        btn.addEventListener('click', () => {
          container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSection = sec.slug;
          loadPosters();
        });
        // Right-click to rename/delete
        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          showSectionMenu(e, sec);
        });
        container.insertBefore(btn, addBtn);
      });

      // Auto-select first section if current doesn't exist
      if (sections.length > 0 && !sections.find(s => s.slug === currentSection)) {
        currentSection = sections[0].slug;
        container.querySelector('.tab-btn')?.classList.add('active');
      }
    }

    // Section context menu
    function showSectionMenu(e, sec) {
      // Remove existing menu
      document.getElementById('section-menu')?.remove();

      const menu = document.createElement('div');
      menu.id = 'section-menu';
      menu.className = 'fixed bg-white rounded-lg shadow-xl border border-gray-200 py-1 z-50';
      menu.style.left = e.clientX + 'px';
      menu.style.top = e.clientY + 'px';
      menu.innerHTML = `
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-gray-50 text-gray-700 cursor-pointer" data-action="rename">Rename</button>
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-red-50 text-red-600 cursor-pointer" data-action="delete">Delete Section</button>
      `;
      document.body.appendChild(menu);

      menu.querySelector('[data-action="rename"]').onclick = async () => {
        menu.remove();
        const newName = prompt('Section name:', sec.name);
        if (!newName || newName === sec.name) return;
        const { error } = await sb.from('sections').update({ name: newName }).eq('id', sec.id);
        if (error) return alert('Error: ' + error.message);
        await loadSections();
      };

      menu.querySelector('[data-action="delete"]').onclick = async () => {
        menu.remove();
        const posterCount = (await sb.from('posters').select('id', { count: 'exact', head: true }).eq('section', sec.slug)).count || 0;
        const msg = posterCount > 0
          ? `This section has ${posterCount} poster(s). Delete the section AND all its posters?`
          : 'Delete this section?';
        if (!confirm(msg)) return;
        // Delete posters in this section first
        if (posterCount > 0) {
          await sb.from('posters').delete().eq('section', sec.slug);
        }
        const { error } = await sb.from('sections').delete().eq('id', sec.id);
        if (error) return alert('Error: ' + error.message);
        currentSection = '';
        await loadSections();
        loadPosters();
      };

      // Close menu on outside click
      setTimeout(() => {
        document.addEventListener('click', function close() {
          menu.remove();
          document.removeEventListener('click', close);
        }, { once: true });
      }, 10);
    }

    // Add new section
    document.getElementById('add-section-btn').addEventListener('click', async () => {
      const name = prompt('New section name:');
      if (!name) return;
      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (!slug) return alert('Invalid name');

      // Check if slug exists
      const { data: existing } = await sb.from('sections').select('id').eq('slug', slug).limit(1);
      if (existing && existing.length > 0) return alert('A section with this name already exists');

      const nextOrder = sections.length > 0 ? Math.max(...sections.map(s => s.sort_order)) + 1 : 1;
      const { error } = await sb.from('sections').insert({ name, slug, sort_order: nextOrder, active: true });
      if (error) return alert('Error: ' + error.message);

      currentSection = slug;
      await loadSections();
      loadPosters();
    });

    // ======= LOAD POSTERS =======
    async function loadPosters() {
      const grid = document.getElementById('poster-grid');
      const loading = document.getElementById('loading');
      const empty = document.getElementById('empty');

      grid.innerHTML = '';
      loading.classList.remove('hidden');
      empty.classList.add('hidden');

      const { data, error } = await sb
        .from('posters')
        .select('*')
        .eq('section', currentSection)
        .order('sort_order', { ascending: true });

      loading.classList.add('hidden');

      if (error) {
        grid.innerHTML = `<p class="col-span-full text-red-500 text-center py-8">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        empty.classList.remove('hidden');
        return;
      }

      data.forEach(poster => {
        grid.innerHTML += renderCard(poster);
      });
    }

    function getImageUrl(path) {
      if (path.startsWith('http')) return path;
      return `${SUPABASE_URL}/storage/v1/object/public/posters/${path}`;
    }

    function renderCard(poster) {
      const tags = poster.tags && poster.tags.length ? poster.tags.map(t => `<span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${t}</span>`).join('') : '';
      return `
        <div class="poster-card bg-white rounded-xl border border-gray-200 overflow-hidden" data-id="${poster.id}">
          <div class="h-48 overflow-hidden bg-gray-100 relative">
            <img src="${getImageUrl(poster.image_url)}" alt="${poster.title}" class="w-full h-full object-cover object-top"
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23f3f4f6%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%239ca3af%22 font-size=%2212%22>No Image</text></svg>'">
            <div class="absolute top-2 right-2 flex gap-1">
              ${poster.active ? '<span class="bg-green-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">Active</span>' : '<span class="bg-gray-400 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">Hidden</span>'}
            </div>
          </div>
          <div class="p-4 space-y-2">
            <h4 class="font-heading font-semibold text-sm text-gray-900 leading-snug">${poster.title}</h4>
            ${poster.description ? `<p class="text-gray-500 text-xs leading-relaxed line-clamp-2">${poster.description}</p>` : ''}
            ${poster.recruitment_info ? `<p class="text-blue-600 text-xs leading-relaxed line-clamp-2 bg-blue-50 rounded px-2 py-1">📋 ${poster.recruitment_info.replace(/\n/g, ' · ')}</p>` : ''}
            ${tags ? `<div class="flex flex-wrap gap-1">${tags}</div>` : ''}
            <div class="flex items-center gap-2 pt-2 border-t border-gray-100">
              <button onclick="toggleActive('${poster.id}', ${!poster.active})" class="text-xs px-3 py-1.5 rounded-md cursor-pointer transition-colors ${poster.active ? 'bg-yellow-50 text-yellow-700 hover:bg-yellow-100' : 'bg-green-50 text-green-700 hover:bg-green-100'}">
                ${poster.active ? 'Hide' : 'Show'}
              </button>
              <button onclick="editPoster('${poster.id}')" class="text-xs bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-1.5 rounded-md cursor-pointer transition-colors">
                Edit
              </button>
              <button onclick="replacePosterImage('${poster.id}')" class="text-xs bg-purple-50 text-purple-700 hover:bg-purple-100 px-3 py-1.5 rounded-md cursor-pointer transition-colors">
                Replace Image
              </button>
              <button onclick="deletePoster('${poster.id}')" class="text-xs bg-red-50 text-red-700 hover:bg-red-100 px-3 py-1.5 rounded-md cursor-pointer transition-colors ml-auto">
                Delete
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ======= ADD POSTER =======
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      const desc = document.getElementById('new-desc').value.trim();
      const infoText = document.getElementById('new-info').value.trim();
      const tagsRaw = document.getElementById('new-tags').value.trim();
      const waText = document.getElementById('new-wa').value.trim();
      const fileInput = document.getElementById('new-image');
      const file = fileInput.files[0];

      if (!file) return alert('Please select an image');

      // Upload image
      const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
      const { error: uploadErr } = await sb.storage
        .from('posters')
        .upload(fileName, file, { contentType: file.type });

      if (uploadErr) return alert('Upload failed: ' + uploadErr.message);

      // Get current max sort_order
      const { data: existing } = await sb
        .from('posters')
        .select('sort_order')
        .eq('section', currentSection)
        .order('sort_order', { ascending: false })
        .limit(1);

      const nextOrder = existing && existing.length > 0 ? existing[0].sort_order + 1 : 1;

      // Insert poster
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
      const { error: insertErr } = await sb
        .from('posters')
        .insert({
          section: currentSection,
          title,
          description: desc,
          recruitment_info: infoText,
          tags,
          image_url: fileName,
          whatsapp_text: waText || `Hi, I am interested in the ${title} position`,
          sort_order: nextOrder,
          active: true
        });

      if (insertErr) return alert('Insert failed: ' + insertErr.message);

      // Reset form and reload
      e.target.reset();
      loadPosters();
    });

    // ======= TOGGLE ACTIVE =======
    async function toggleActive(id, newState) {
      const { error } = await sb.from('posters').update({ active: newState }).eq('id', id);
      if (error) return alert('Error: ' + error.message);
      loadPosters();
    }

    // ======= DELETE =======
    async function deletePoster(id) {
      if (!confirm('Are you sure you want to delete this poster?')) return;
      const { error } = await sb.from('posters').delete().eq('id', id);
      if (error) return alert('Error: ' + error.message);
      loadPosters();
    }

    // ======= EDIT MODAL =======
    async function editPoster(id) {
      const { data } = await sb.from('posters').select('*').eq('id', id).single();
      if (!data) return;

      // Remove existing modal if any
      document.getElementById('edit-modal')?.remove();

      const modal = document.createElement('div');
      modal.id = 'edit-modal';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center px-4';
      modal.innerHTML = `
        <div class="fixed inset-0 bg-black/50" onclick="closeEditModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-heading font-bold text-lg text-gray-900">Edit Poster</h3>
            <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 cursor-pointer text-2xl leading-none">&times;</button>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
            <input id="edit-title" type="text" value="${data.title.replace(/"/g, '&quot;')}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="edit-desc" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">${(data.description || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Recruitment Info</label>
            <textarea id="edit-info" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Requirements, qualifications, salary, etc.">${(data.recruitment_info || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tags (comma separated)</label>
            <input id="edit-tags" type="text" value="${(data.tags || []).join(', ')}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Python, Docker, SQL">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Message</label>
            <input id="edit-wa" type="text" value="${(data.whatsapp_text || '').replace(/"/g, '&quot;')}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Hi, I am interested in...">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sort Order</label>
            <input id="edit-order" type="number" value="${data.sort_order}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          </div>
          <div class="flex gap-3 pt-2">
            <button onclick="closeEditModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg transition-colors cursor-pointer text-sm">Cancel</button>
            <button onclick="saveEdit('${id}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors cursor-pointer text-sm">Save Changes</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('edit-title').focus();

      // Close on Escape key
      modal._escHandler = (e) => { if (e.key === 'Escape') closeEditModal(); };
      document.addEventListener('keydown', modal._escHandler);
    }

    function closeEditModal() {
      const modal = document.getElementById('edit-modal');
      if (modal) {
        document.removeEventListener('keydown', modal._escHandler);
        modal.remove();
      }
    }

    async function saveEdit(id) {
      const title = document.getElementById('edit-title').value.trim();
      const desc = document.getElementById('edit-desc').value.trim();
      const info = document.getElementById('edit-info').value.trim();
      const tagsRaw = document.getElementById('edit-tags').value.trim();
      const wa = document.getElementById('edit-wa').value.trim();
      const order = document.getElementById('edit-order').value;

      if (!title) return alert('Title is required');

      const updates = {
        title,
        description: desc,
        recruitment_info: info,
        tags: tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [],
        whatsapp_text: wa,
        sort_order: parseInt(order) || 0
      };

      const { error } = await sb.from('posters').update(updates).eq('id', id);
      if (error) return alert('Error: ' + error.message);
      closeEditModal();
      loadPosters();
    }

    // ======= REPLACE IMAGE =======
    async function replacePosterImage(id) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/jpeg,image/png,image/webp';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;

        const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
        const { error: uploadErr } = await sb.storage
          .from('posters')
          .upload(fileName, file, { contentType: file.type });

        if (uploadErr) return alert('Upload failed: ' + uploadErr.message);

        const { error } = await sb.from('posters').update({ image_url: fileName }).eq('id', id);
        if (error) return alert('Error: ' + error.message);
        loadPosters();
      };
      input.click();
    }
  </script>
</body>
</html>
