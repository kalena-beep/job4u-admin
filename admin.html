<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobs4U.sg Admin — Job & Applicant Management</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ["Poppins", "sans-serif"], body: ["Open Sans", "sans-serif"] }
        }
      }
    };
  </script>
  <style>
    body { font-family: "Open Sans", sans-serif; }
    h1, h2, h3, h4 { font-family: "Poppins", sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="flex min-h-screen items-center justify-center px-4">
    <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-lg">
      <h1 class="font-heading text-center text-2xl font-bold text-gray-900">
        Jobs4U.sg <span class="text-[#DD183B]">Admin</span>
      </h1>
      <p class="mt-1 mb-7 text-center text-sm text-gray-500">Sign in to manage jobs and applicants</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700" for="login-email">Email</label>
          <input id="login-email" type="email" required placeholder="admin@jobs4u.sg" class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-[#DD183B]" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700" for="login-password">Password</label>
          <input id="login-password" type="password" required placeholder="Your admin password" class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-[#DD183B]" />
        </div>
        <div id="login-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-xs font-medium text-red-600"></div>
        <button id="login-btn" type="submit" class="w-full rounded-lg bg-[#DD183B] py-2.5 text-sm font-semibold text-white transition-colors hover:bg-[#CC1939] cursor-pointer">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="admin-dashboard" class="hidden">
    <header class="sticky top-0 z-20 border-b border-gray-200 bg-white">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6">
        <div>
          <h1 class="font-heading text-xl font-bold">Jobs4U.sg <span class="text-[#DD183B]">Admin</span></h1>
          <p id="admin-user-label" class="text-xs text-gray-500">PostgreSQL Job & Applicant Dashboard</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="tab-jobs" type="button" class="rounded-lg bg-[#DD183B] px-4 py-2 text-sm font-semibold text-white cursor-pointer">
            Job Management
          </button>
          <button id="tab-applicants" type="button" class="rounded-lg bg-gray-100 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200 cursor-pointer">
            Applicant Management
          </button>
          <button id="logout-btn" type="button" class="ml-2 rounded-lg border border-gray-300 px-3 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-50 cursor-pointer">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
      <div id="alert-box" class="mb-6 hidden rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm font-medium"></div>

      <!-- JOB MANAGEMENT -->
      <section id="section-jobs" class="space-y-8">
        <form id="job-form" class="grid gap-4 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:grid-cols-2">
          <div class="sm:col-span-2 flex items-center justify-between">
            <h2 id="form-heading" class="font-heading text-lg font-bold">Create New Job Vacancy</h2>
            <button id="cancel-edit-btn" type="button" class="hidden text-xs font-semibold text-gray-500 hover:text-gray-800 cursor-pointer">
              Cancel Edit
            </button>
          </div>

          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-title">Job Title *</label>
            <input id="job-title" type="text" required placeholder="e.g. Marketing Executive" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-company">Company *</label>
            <input id="job-company" type="text" required placeholder="e.g. BrightPath Media" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-location">Location *</label>
            <input id="job-location" type="text" required placeholder="e.g. Raffles Place" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-type">Employment Type *</label>
            <select id="job-type" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]">
              <option value="Full-time">Full-time</option>
              <option value="Part-time">Part-time</option>
              <option value="Contract">Contract</option>
            </select>
          </div>

          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-mode">Work Mode</label>
            <select id="job-mode" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]">
              <option value="On-site">On-site</option>
              <option value="Hybrid">Hybrid</option>
              <option value="Remote">Remote</option>
            </select>
          </div>

          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-salary">Salary (Optional)</label>
            <input id="job-salary" type="text" placeholder="e.g. SGD 3,500 - 4,500" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]" />
          </div>

          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-wa">WhatsApp Number (Optional)</label>
            <input id="job-wa" type="text" placeholder="e.g. 089688012359 or 6591234567" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]" />
          </div>

          <div class="flex items-center gap-6 pt-5">
            <label class="inline-flex items-center gap-2 text-sm font-medium text-gray-700 cursor-pointer">
              <input id="job-published" type="checkbox" checked class="h-4 w-4 rounded border-gray-300" />
              Published
            </label>
            <label class="inline-flex items-center gap-2 text-sm font-medium text-gray-700 cursor-pointer">
              <input id="job-featured" type="checkbox" class="h-4 w-4 rounded border-gray-300" />
              Featured
            </label>
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-xs font-semibold uppercase text-gray-600" for="job-desc">Job Description *</label>
            <textarea id="job-desc" rows="4" required placeholder="Responsibilities, requirements, benefits..." class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-[#DD183B]"></textarea>
          </div>

          <div class="sm:col-span-2 flex justify-end">
            <button id="submit-job-btn" type="submit" class="rounded-lg bg-[#DD183B] px-6 py-2.5 text-sm font-semibold text-white hover:bg-[#CC1939] cursor-pointer">
              Save Job Vacancy
            </button>
          </div>
        </form>

        <div class="overflow-x-auto rounded-2xl border border-gray-200 bg-white shadow-sm">
          <table class="w-full text-left text-sm">
            <thead class="border-b border-gray-200 bg-gray-50 text-xs uppercase text-gray-500">
              <tr>
                <th class="px-4 py-3">Position & Company</th>
                <th class="px-4 py-3">Public URL</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="jobs-tbody" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </section>

      <!-- APPLICANT MANAGEMENT -->
      <section id="section-applicants" class="hidden space-y-6">
        <div class="flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
          <div class="flex flex-wrap items-center gap-4">
            <label class="text-sm font-semibold text-gray-700">
              Job Vacancy:
              <select id="applicant-job-filter" class="ml-2 rounded-lg border border-gray-300 px-3 py-1.5 text-sm font-normal">
                <option value="">All Job Vacancies</option>
              </select>
            </label>
            <label class="text-sm font-semibold text-gray-700">
              Status:
              <select id="applicant-status-filter" class="ml-2 rounded-lg border border-gray-300 px-3 py-1.5 text-sm font-normal">
                <option value="">All Statuses</option>
                <option value="NEW">NEW</option>
                <option value="REVIEWED">REVIEWED</option>
                <option value="SHORTLISTED">SHORTLISTED</option>
                <option value="REJECTED">REJECTED</option>
              </select>
            </label>
          </div>
          <span id="applicant-count" class="text-xs font-semibold text-gray-500">0 applications</span>
        </div>

        <div id="applicants-list" class="space-y-4"></div>
      </section>
    </main>
  </div>

  <script>
    const TOKEN_KEY = "jobs4u_admin_token";
    const EMAIL_KEY = "jobs4u_admin_email";
    const PUBLIC_BASE_URL = window.location.hostname === "localhost"
      ? "http://localhost:8080"
      : "";

    const STATUS_BADGE_CLASSES = {
      NEW: "bg-blue-100 text-blue-800",
      REVIEWED: "bg-amber-100 text-amber-800",
      SHORTLISTED: "bg-emerald-100 text-emerald-800",
      REJECTED: "bg-red-100 text-red-800",
    };

    let jobsCache = [];
    let editingJobId = null;

    const loginScreen = document.getElementById("login-screen");
    const adminDashboard = document.getElementById("admin-dashboard");
    const loginError = document.getElementById("login-error");
    const alertBox = document.getElementById("alert-box");

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }

    function showLogin(message = "") {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(EMAIL_KEY);
      adminDashboard.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      if (message) {
        loginError.textContent = message;
        loginError.classList.remove("hidden");
      } else {
        loginError.classList.add("hidden");
      }
    }

    function showDashboard() {
      loginScreen.classList.add("hidden");
      adminDashboard.classList.remove("hidden");
      const savedEmail = localStorage.getItem(EMAIL_KEY);
      if (savedEmail) {
        document.getElementById("admin-user-label").textContent = `Signed in as ${savedEmail}`;
      }
      loadJobs();
    }

    async function apiFetch(url, options = {}) {
      const token = getToken();
      const headers = {
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`,
      };
      const res = await fetch(url, { ...options, headers });
      if (res.status === 401) {
        showLogin("Session expired. Please sign in again.");
        throw new Error("Unauthorized");
      }
      return res;
    }

    function showAlert(message, isError = false) {
      alertBox.textContent = message;
      alertBox.className = `mb-6 rounded-xl border px-4 py-3 text-sm font-medium ${
        isError ? "border-red-200 bg-red-50 text-red-700" : "border-emerald-200 bg-emerald-50 text-emerald-800"
      }`;
      alertBox.classList.remove("hidden");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Login & Logout
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          loginError.textContent = data.message || "Invalid credentials.";
          loginError.classList.remove("hidden");
          return;
        }

        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(EMAIL_KEY, data.email || email);
        showDashboard();
      } catch {
        loginError.textContent = "Unable to connect to server.";
        loginError.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      const token = getToken();
      if (token) {
        await fetch("/api/auth/logout", {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
        }).catch(() => {});
      }
      showLogin();
    });

    // Tabs
    const tabJobs = document.getElementById("tab-jobs");
    const tabApplicants = document.getElementById("tab-applicants");
    const sectionJobs = document.getElementById("section-jobs");
    const sectionApplicants = document.getElementById("section-applicants");

    tabJobs.addEventListener("click", () => {
      tabJobs.className = "rounded-lg bg-[#DD183B] px-4 py-2 text-sm font-semibold text-white cursor-pointer";
      tabApplicants.className = "rounded-lg bg-gray-100 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200 cursor-pointer";
      sectionJobs.classList.remove("hidden");
      sectionApplicants.classList.add("hidden");
      loadJobs();
    });

    tabApplicants.addEventListener("click", () => {
      tabApplicants.className = "rounded-lg bg-[#DD183B] px-4 py-2 text-sm font-semibold text-white cursor-pointer";
      tabJobs.className = "rounded-lg bg-gray-100 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200 cursor-pointer";
      sectionApplicants.classList.remove("hidden");
      sectionJobs.classList.add("hidden");
      loadApplicants();
    });

    // Job Form
    const jobForm = document.getElementById("job-form");
    const formHeading = document.getElementById("form-heading");
    const cancelEditBtn = document.getElementById("cancel-edit-btn");

    function resetForm() {
      editingJobId = null;
      jobForm.reset();
      document.getElementById("job-published").checked = true;
      formHeading.textContent = "Create New Job Vacancy";
      cancelEditBtn.classList.add("hidden");
    }

    cancelEditBtn.addEventListener("click", resetForm);

    function startEdit(jobId) {
      const job = jobsCache.find((j) => String(j.id) === String(jobId));
      if (!job) return;
      editingJobId = job.id;
      document.getElementById("job-title").value = job.title || "";
      document.getElementById("job-company").value = job.company || "";
      document.getElementById("job-location").value = job.location || "";
      document.getElementById("job-type").value = job.employmentType || "Full-time";
      document.getElementById("job-mode").value = job.workMode || "On-site";
      document.getElementById("job-salary").value = job.salary || "";
      document.getElementById("job-wa").value = job.whatsappNumber || "";
      document.getElementById("job-desc").value = job.description || "";
      document.getElementById("job-published").checked = job.published !== false;
      document.getElementById("job-featured").checked = Boolean(job.featured);
      formHeading.textContent = `Edit Job: ${job.title}`;
      cancelEditBtn.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    jobForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById("job-title").value.trim(),
        company: document.getElementById("job-company").value.trim(),
        location: document.getElementById("job-location").value.trim(),
        employmentType: document.getElementById("job-type").value,
        workMode: document.getElementById("job-mode").value,
        salary: document.getElementById("job-salary").value.trim() || null,
        whatsappNumber: document.getElementById("job-wa").value.trim() || null,
        description: document.getElementById("job-desc").value.trim(),
        published: document.getElementById("job-published").checked,
        featured: document.getElementById("job-featured").checked,
      };

      if (!payload.title || !payload.company || !payload.location || !payload.description) {
        return showAlert("Please fill in all required fields (*).", true);
      }

      const url = editingJobId ? `/api/jobs/${encodeURIComponent(editingJobId)}` : "/api/jobs";
      const method = editingJobId ? "PATCH" : "POST";

      const res = await apiFetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        return showAlert(data.message || "Failed to save job posting.", true);
      }

      resetForm();
      showAlert(editingJobId ? "Job posting updated." : "New job vacancy created.");
      await loadJobs();
    });

    async function togglePublish(jobId, nextPublished) {
      const res = await apiFetch(`/api/jobs/${encodeURIComponent(jobId)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ published: nextPublished }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return showAlert(data.message || "Failed to update status.", true);
      showAlert(nextPublished ? "Job published." : "Job unpublished.");
      await loadJobs();
    }

    async function deleteJob(jobId) {
      if (!confirm("Delete this job posting permanently?")) return;
      const res = await apiFetch(`/api/jobs/${encodeURIComponent(jobId)}`, { method: "DELETE" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return showAlert(data.message || "Failed to delete job.", true);
      showAlert("Job posting deleted.");
      await loadJobs();
    }

    function syncJobFilterOptions() {
      const select = document.getElementById("applicant-job-filter");
      const currentVal = select.value;
      select.innerHTML = `<option value="">All Job Vacancies</option>` + jobsCache
        .map((j) => `<option value="${escapeHtml(j.id)}">${escapeHtml(j.title)} — ${escapeHtml(j.company)}</option>`)
        .join("");
      select.value = currentVal;
    }

    async function loadJobs() {
      const res = await apiFetch("/api/jobs");
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        return showAlert(data.message || "Failed to load jobs.", true);
      }

      jobsCache = Array.isArray(data.jobs) ? data.jobs : [];
      syncJobFilterOptions();

      const tbody = document.getElementById("jobs-tbody");
      if (!jobsCache.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">No job vacancies yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = jobsCache.map((job) => {
        const isPub = job.published !== false;
        const publicUrl = `${PUBLIC_BASE_URL}/${encodeURIComponent(job.slug)}`;
        return `
          <tr>
            <td class="px-4 py-3">
              <div class="font-semibold text-gray-900">${escapeHtml(job.title)} ${job.featured ? '<span class="ml-1 rounded bg-amber-100 px-1.5 py-0.5 text-[10px] font-bold text-amber-800">FEATURED</span>' : ""}</div>
              <div class="text-xs text-gray-500">${escapeHtml(job.company)} · ${escapeHtml(job.location)} · ${escapeHtml(job.employmentType)}</div>
            </td>
            <td class="px-4 py-3 font-mono text-xs">
              <a href="${escapeHtml(publicUrl)}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline">/${escapeHtml(job.slug)}</a>
            </td>
            <td class="px-4 py-3">
              <span class="rounded-full px-2.5 py-1 text-xs font-semibold ${isPub ? "bg-emerald-100 text-emerald-800" : "bg-gray-200 text-gray-700"}">
                ${isPub ? "Published" : "Unpublished"}
              </span>
            </td>
            <td class="px-4 py-3 text-right space-x-1.5">
              <button type="button" onclick="togglePublish('${escapeHtml(job.id)}', ${!isPub})" class="rounded-lg border border-gray-300 px-2.5 py-1 text-xs font-semibold hover:bg-gray-50 cursor-pointer">
                ${isPub ? "Unpublish" : "Publish"}
              </button>
              <button type="button" onclick="startEdit('${escapeHtml(job.id)}')" class="rounded-lg border border-gray-300 px-2.5 py-1 text-xs font-semibold hover:bg-gray-50 cursor-pointer">
                Edit
              </button>
              <button type="button" onclick="deleteJob('${escapeHtml(job.id)}')" class="rounded-lg border border-red-200 bg-red-50 px-2.5 py-1 text-xs font-semibold text-red-700 hover:bg-red-100 cursor-pointer">
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    // Applicants
    const applicantJobFilter = document.getElementById("applicant-job-filter");
    const applicantStatusFilter = document.getElementById("applicant-status-filter");

    applicantJobFilter.addEventListener("change", loadApplicants);
    applicantStatusFilter.addEventListener("change", loadApplicants);

    async function updateAppStatus(appId, status) {
      const res = await apiFetch(`/api/applications/${encodeURIComponent(appId)}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return showAlert(data.message || "Failed to update application status.", true);
      showAlert(`Application status updated to ${status}.`);
      await loadApplicants();
    }

    async function loadApplicants() {
      const jobId = applicantJobFilter.value;
      const statusFilter = applicantStatusFilter.value;
      const params = new URLSearchParams();
      if (jobId) params.set("jobId", jobId);
      const query = params.toString() ? `?${params.toString()}` : "";

      const res = await apiFetch(`/api/applications${query}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        return showAlert(data.message || "Failed to load applications.", true);
      }

      let apps = Array.isArray(data.applications) ? data.applications : [];
      if (statusFilter) {
        apps = apps.filter((a) => String(a.status || "NEW").toUpperCase() === statusFilter);
      }

      document.getElementById("applicant-count").textContent = `${apps.length} application${apps.length === 1 ? "" : "s"}`;

      const container = document.getElementById("applicants-list");
      if (!apps.length) {
        container.innerHTML = `<div class="rounded-2xl border border-gray-200 bg-white p-8 text-center text-sm text-gray-500">No applications found.</div>`;
        return;
      }

      const token = encodeURIComponent(getToken());
      container.innerHTML = apps.map((app) => {
        const currentStatus = String(app.status || "NEW").toUpperCase();
        const badgeClass = STATUS_BADGE_CLASSES[currentStatus] || "bg-gray-100 text-gray-800";
        const statuses = ["NEW", "REVIEWED", "SHORTLISTED", "REJECTED"];
        const optionsHtml = statuses
          .map((st) => `<option value="${st}" ${currentStatus === st ? "selected" : ""}>${st}</option>`)
          .join("");

        return `
          <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm space-y-3">
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="font-heading text-base font-bold text-gray-900">${escapeHtml(app.fullName)}</h3>
                  <span class="rounded-full px-2.5 py-0.5 text-[11px] font-semibold ${badgeClass}">${escapeHtml(currentStatus)}</span>
                </div>
                <p class="text-xs text-gray-600">${escapeHtml(app.email)} · ${escapeHtml(app.phone)}</p>
                <p class="mt-1 text-xs font-semibold text-[#DD183B]">
                  Role: ${escapeHtml(app.jobTitle || `Job #${app.jobId}`)}${app.jobCompany ? ` (${escapeHtml(app.jobCompany)})` : ""}
                </p>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <select onchange="updateAppStatus('${escapeHtml(app.id)}', this.value)" class="rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-semibold">
                  ${optionsHtml}
                </select>
                <a href="/api/applications/${encodeURIComponent(app.id)}/cv?token=${token}" class="rounded-lg bg-gray-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-gray-800">
                  Download CV
                </a>
              </div>
            </div>

            <div class="rounded-xl bg-gray-50 p-3 text-xs leading-relaxed text-gray-700 whitespace-pre-line">${escapeHtml(app.coverLetter)}</div>
          </div>
        `;
      }).join("");
    }

    // Init
    if (getToken()) {
      showDashboard();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
